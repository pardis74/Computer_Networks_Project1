options {
    directory "/tmp";
    listen-on { any; };
    listen-on-v6 { none; };

    // This project uses a deterministic private zone. Internet recursion is
    // intentionally disabled so tests do not depend on external connectivity.
    recursion no;
    allow-query { any; };
};

zone "lab.test" IN {
    type master;
    file "/etc/bind/db.lab.test";
};
